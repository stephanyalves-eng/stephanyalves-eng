  <line x1="62" y1="58" x2="62" y2="236" stroke="#1E5246" stroke-width="1"/>

  <text class="mono ln" x="44" y="88" text-anchor="end">1</text>
  <text class="mono" x="80" y="88"><tspan class="kw">AI extracts.</tspan><tspan class="tx"> Code calculates. </tspan><tspan class="kw">You decide.</tspan></text>

  <text class="mono ln" x="44" y="128" text-anchor="end">2</text>
  <text class="mono" x="80" y="128"><tspan class="tx">Calculations stay </tspan><tspan class="kw">deterministic</tspan><tspan class="tx">.</tspan></text>

  <text class="mono ln" x="44" y="168" text-anchor="end">3</text>
