    </style>
  </defs>

  <rect width="900" height="250" rx="14" fill="#0B302B"/>
  <rect x="0.75" y="0.75" width="898.5" height="248.5" rx="13.5" fill="none" stroke="#1E5246" stroke-width="1.5"/>

  <!-- window bar -->
  <path d="M0 14 A14 14 0 0 1 14 0 H886 A14 14 0 0 1 900 14 V44 H0 Z" fill="#123D35"/>
  <circle cx="24" cy="22" r="6" fill="#1E5246"/>
  <circle cx="44" cy="22" r="6" fill="#1E5246"/>
  <circle cx="64" cy="22" r="6" fill="#35D58A"/>
  <rect x="92" y="10" width="132" height="34" rx="6" fill="#0B302B"/>
  <rect x="92" y="41" width="132" height="3" fill="#35D58A"/>
  <text class="mono tab" x="158" y="31" text-anchor="middle">principles.md</text>
  <text class="mono cm" x="876" y="28" text-anchor="end">how I make sourcing decisions</text>

