name: Recent activity

# Refreshes the "Recent activity" list in README.md with the latest commit in each of
# the most recently updated projects (the profile repository and bots are left out).
# Commits only when the list changes.

on:
  schedule:
    - cron: "41 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rewrite the list
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/recent_activity.py "${{ github.repository_owner }}" README.md
      - name: Commit if changed
        run: |
          if git diff --quiet -- README.md; then
            echo "No change in recent activity"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update recent activity"
          git push
