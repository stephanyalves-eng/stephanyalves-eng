name: Recent activity

# Refreshes the "Recent activity" list in README.md with the latest public
# pull requests, comments and releases, newest first. Issue events are left out
# because every label added to an issue shows up as a separate line.

on:
  schedule:
    - cron: "41 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jamesgeorge007/github-activity-readme@v0.5.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          GH_USERNAME: stephanyalves-eng
          MAX_LINES: 5
          FILTER_EVENTS: "PullRequestEvent,IssueCommentEvent,ReleaseEvent"
          COMMIT_MSG: "Update recent activity"
