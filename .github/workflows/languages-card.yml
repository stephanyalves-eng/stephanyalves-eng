name: Languages card

# Rebuilds assets/languages.svg from the languages of the public repositories,
# with colors from the profile palette. Commits only when the numbers change.

on:
  schedule:
    - cron: "5 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/languages_card.py "${{ github.repository_owner }}" assets/languages.svg
      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/languages.svg; then
            echo "No change in languages card"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/languages.svg
          git commit -m "Update languages card"
          git push
